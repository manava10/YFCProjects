name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yfc_test
          POSTGRES_USER: yfc
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yfc -d yfc_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      YFC_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/yfc_test
      YFC_TEST_POSTGRES_USER: yfc
      YFC_TEST_POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
