name: Deploy to AWS EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:

# Never cancel an active production deployment mid-restart; queue the next push cleanly.
concurrency:
  group: deploy-production-ec2
  cancel-in-progress: false

# Strict least privilege: id-token: write enables keyless AWS OIDC authentication.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-test-backend:
    name: Test & Build Backend JAR
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yfc_test
          POSTGRES_USER: yfc
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yfc -d yfc_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      YFC_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/yfc_test
      YFC_TEST_POSTGRES_USER: yfc
      YFC_TEST_POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run full test suite (H2 + PostgreSQL 17) & package JAR
        run: mvn -B -f backend/pom.xml clean verify

      - name: Verify runnable JAR exists
        run: |
          JAR_PATH="$(ls backend/target/yfc-backend-*.jar | grep -v '\.original$' | head -n 1)"
          test -s "$JAR_PATH"
          cp "$JAR_PATH" backend/target/yfc-backend.jar
          ls -lh backend/target/yfc-backend.jar

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: yfc-backend-jar
          path: backend/target/yfc-backend.jar
          retention-days: 1

  build-and-test-frontend:
    name: Test & Build Frontend Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Type-check & build production bundle
        run: npm run build

      - name: Archive frontend/dist
        run: |
          test -f dist/index.html
          tar -czf ../frontend-dist.tar.gz -C dist .
          ls -lh ../frontend-dist.tar.gz

      - name: Upload frontend archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: yfc-frontend-dist
          path: frontend-dist.tar.gz
          retention-days: 1

  deploy-to-ec2:
    name: Deploy to EC2 via S3 + AWS SSM
    needs: [build-and-test-backend, build-and-test-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment script syntax
        run: bash -n deploy/ec2/apply-release.sh

      - name: Check required GitHub production environment settings
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}
        run: |
          missing=0
          for name in AWS_DEPLOY_ROLE_ARN EC2_INSTANCE_ID AWS_REGION S3_DEPLOY_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub 'production' environment setting: ${name}. See docs/aws-ec2-deployment-guide.md (Appendix C)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Download built backend & frontend artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Authenticate to AWS via GitHub OIDC (no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release artifacts to S3
        id: upload
        env:
          S3_DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}
        run: |
          RELEASE_TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          S3_PREFIX="s3://${S3_DEPLOY_BUCKET}/deployments/${RELEASE_TAG}"
          echo "Uploading release ${RELEASE_TAG} to ${S3_PREFIX}..."

          aws s3 cp artifacts/yfc-backend-jar/yfc-backend.jar "${S3_PREFIX}/yfc-backend.jar" --sse AES256 --only-show-errors
          aws s3 cp artifacts/yfc-frontend-dist/frontend-dist.tar.gz "${S3_PREFIX}/frontend-dist.tar.gz" --sse AES256 --only-show-errors
          aws s3 cp deploy/ec2/apply-release.sh "${S3_PREFIX}/apply-release.sh" --sse AES256 --only-show-errors

      - name: Trigger atomic deploy on EC2 via AWS SSM & wait for health check
        env:
          S3_DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          RELEASE_TAG: ${{ steps.upload.outputs.release_tag }}
        run: |
          PARAMS_JSON="$(jq -n \
            --arg bucket "$S3_DEPLOY_BUCKET" \
            --arg tag "$RELEASE_TAG" \
            '{
              commands: [
                "set -euo pipefail",
                "export PATH=\"/snap/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"",
                ("aws s3 cp \"s3://" + $bucket + "/deployments/" + $tag + "/apply-release.sh\" \"/tmp/apply-release-" + $tag + ".sh\" --only-show-errors"),
                ("chmod +x \"/tmp/apply-release-" + $tag + ".sh\""),
                ("bash \"/tmp/apply-release-" + $tag + ".sh\" \"" + $bucket + "\" \"" + $tag + "\"")
              ]
            }')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy YFC release ${RELEASE_TAG}" \
            --timeout-seconds 300 \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM Command ID: ${COMMAND_ID}"

          STATUS="Pending"
          for i in $(seq 1 60); do
            sleep 5
            OUTPUT_JSON="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)"

            if [ -z "$OUTPUT_JSON" ]; then
              echo "Waiting for SSM invocation to register (${i}/60)..."
              continue
            fi

            STATUS="$(echo "$OUTPUT_JSON" | jq -r '.Status')"
            echo "SSM status: ${STATUS} (${i}/60)"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                echo "========== EC2 STDOUT =========="
                echo "$OUTPUT_JSON" | jq -r '.StandardOutputContent'
                STDERR="$(echo "$OUTPUT_JSON" | jq -r '.StandardErrorContent')"
                if [ -n "$STDERR" ]; then
                  echo "========== EC2 STDERR =========="
                  echo "$STDERR"
                fi
                break
                ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "::error::EC2 deployment failed with SSM status: ${STATUS}"
            exit 1
          fi
