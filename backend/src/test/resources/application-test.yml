spring:
  datasource:
    url: jdbc:h2:mem:yfc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate

yfc:
  database:
    auth-mode: password
    maximum-pool-size: 4
  rate-limit:
    enabled: true
    login-per-minute: 500
    auth-per-minute: 500
    public-write-per-minute: 500
    public-read-per-minute: 1000
  alerts:
    scheduling-enabled: false
