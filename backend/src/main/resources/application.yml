spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: yfc-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yfc}
    username: ${DB_USER:yfc}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

yfc:
  database:
    auth-mode: ${DB_AUTH_MODE:password}
    aws-region: ${AWS_REGION:}
    maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  session:
    ttl-hours: ${SESSION_TTL_HOURS:12}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-proxy: ${RATE_LIMIT_TRUST_PROXY:false}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:25}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:10}
    public-write-per-minute: ${RATE_LIMIT_PUBLIC_WRITE_PER_MIN:15}
    public-read-per-minute: ${RATE_LIMIT_PUBLIC_READ_PER_MIN:120}
  documents:
    storage: ${DOCUMENTS_STORAGE:DATABASE}
    local-dir: ${DOCUMENTS_LOCAL_DIR:./data/documents}
    s3:
      bucket: ${DOCUMENTS_S3_BUCKET:}
      region: ${DOCUMENTS_S3_REGION:${AWS_REGION:ap-south-2}}
      prefix: ${DOCUMENTS_S3_PREFIX:yfc-documents}
      endpoint: ${DOCUMENTS_S3_ENDPOINT:}
  alerts:
    scheduling-enabled: ${ALERTS_SCHEDULING_ENABLED:true}
    digest-cron: ${ALERTS_DIGEST_CRON:0 0 8 * * *}
    webhook-url: ${ALERTS_WEBHOOK_URL:}
