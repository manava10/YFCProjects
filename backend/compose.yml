services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: yfc
      POSTGRES_USER: yfc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yfc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yfc -d yfc"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  yfc-postgres:
